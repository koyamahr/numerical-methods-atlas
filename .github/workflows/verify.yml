name: Numerical validation
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    # Keep Python 3.9 available when ubuntu-latest advances.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m numart.cli gallery --output outputs/gallery
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-gallery-py${{ matrix.python-version }}
          path: outputs/gallery

  website:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
