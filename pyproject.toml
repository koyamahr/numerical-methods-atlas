[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "art-of-numerical-algorithms"
version = "0.1.0"
description = "A historical, executable showcase of numerical conservation laws"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
movies = ["imageio-ffmpeg==0.6.0"]

[project.scripts]
numart = "numart.cli:main"

[tool.setuptools.packages.find]
include = ["numart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
